<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AsifTechGlobal — Login</title>
<style>
/* ══════════════════════════════════════
   ASIFTECHGLOBAL — DESIGN TOKENS
══════════════════════════════════════ */
:root{
  /* Core background */
  --bg:       #02040a;
  --bg2:      #060c18;
  --bg3:      #0a1228;
  --bg4:      #0d1530;

  /* Glass surfaces */
  --glass:    rgba(6,12,24,0.85);
  --glass2:   rgba(10,18,40,0.92);

  /* Borders */
  --b0: rgba(255,255,255,0.04);
  --b1: rgba(255,255,255,0.08);
  --b2: rgba(255,255,255,0.14);
  --b3: rgba(255,255,255,0.22);

  /* Typography */
  --tx:  #f0f4ff;
  --tx2: #b8c4e0;
  --mu:  #5a6e8e;
  --mu2: #8599bb;

  /* Brand — ATG Gold/Cyan */
  --gold:  #f0b429;
  --gold2: #e09b10;
  --gold3: rgba(240,180,41,0.12);

  --cyan:  #00e5ff;
  --cyan2: #00b8d9;
  --cyan3: rgba(0,229,255,0.12);

  /* Accents */
  --green: #00ffaa;
  --blue:  #4f8dff;
  --pu:    #8b5cf6;
  --re:    #f85149;
  --or:    #fb923c;

  /* ATG Brand Gradient — Gold to Cyan */
  --atg:   linear-gradient(135deg, #f0b429 0%, #00e5ff 100%);
  --atg2:  linear-gradient(135deg, #f0b429 0%, #fb923c 50%, #f85149 100%);
  --atg3:  linear-gradient(135deg, #00e5ff 0%, #4f8dff 100%);

  /* Shadows */
  --sh:   0 32px 80px rgba(0,0,0,.70), 0 8px 24px rgba(0,0,0,.50);
  --shg:  0 0 40px rgba(240,180,41,.18), 0 0 80px rgba(0,229,255,.08);

  /* Radius */
  --r:   22px;
  --rm:  16px;
  --rs:  10px;
  --rxs: 7px;

  /* Ease */
  --ease: cubic-bezier(.4,0,.2,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

/* ══ RESET ══ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Inter,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}

/* ══════════════════════════════════════
   ANIMATED BACKGROUND — ATG STYLE
══════════════════════════════════════ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

/* Deep space base */
.bg-base{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 100% 60% at 0% 0%,   rgba(240,180,41,.08)  0%,transparent 50%),
    radial-gradient(ellipse 80%  60% at 100% 100%,rgba(0,229,255,.07)   0%,transparent 50%),
    radial-gradient(ellipse 60%  50% at 50%  50%, rgba(139,92,246,.04)  0%,transparent 60%),
    linear-gradient(180deg,#030610 0%,#02040a 100%);
}

/* Gold/Cyan orbs */
.orb{position:absolute;border-radius:50%;filter:blur(90px);animation:orbF 18s ease-in-out infinite;pointer-events:none}
.og{width:560px;height:560px;top:-200px;left:-160px;
    background:radial-gradient(circle,rgba(240,180,41,.14),transparent 65%);animation-duration:20s}
.oc{width:500px;height:500px;bottom:-180px;right:-140px;
    background:radial-gradient(circle,rgba(0,229,255,.12),transparent 65%);animation-duration:15s;animation-delay:-8s}
.op{width:340px;height:340px;top:35%;left:50%;
    background:radial-gradient(circle,rgba(139,92,246,.08),transparent 65%);animation-duration:12s;animation-delay:-4s}
@keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}38%{transform:translate(25px,-32px) scale(1.05)}72%{transform:translate(-18px,22px) scale(.95)}}

/* Hex grid overlay */
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(240,180,41,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(240,180,41,.018) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 10%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 10%,transparent 75%);
}

/* Particles */
canvas#ptc{position:absolute;inset:0}

/* Scan-line shimmer */
.scanline{
  position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,rgba(0,229,255,.012) 2px,rgba(0,229,255,.012) 4px
  );animation:scan 8s linear infinite;
}
@keyframes scan{from{background-position:0 0}to{background-position:0 100px}}

/* ══ LAYOUT ══ */
.wrap{
  position:relative;z-index:1;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px 16px 52px;
  padding-bottom:max(52px,env(safe-area-inset-bottom,52px));
}

/* ══════════════════════════════════════
   ATG BRAND MARK
══════════════════════════════════════ */
.brand{text-align:center;margin-bottom:28px;animation:brandIn .6s var(--spring)}
@keyframes brandIn{from{opacity:0;transform:translateY(-18px) scale(.92)}to{opacity:1;transform:none}}

/* Hexagonal logo mark */
.brand-hex{
  width:88px;height:88px;margin:0 auto 18px;
  position:relative;display:flex;align-items:center;justify-content:center;
  animation:hexFloat 6s ease-in-out infinite;
}
@keyframes hexFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* SVG hex background + glow */
.brand-hex::before{
  content:'';position:absolute;inset:0;
  background:var(--atg);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  animation:hexGlow 6s ease-in-out infinite;
}
@keyframes hexGlow{
  0%,100%{filter:drop-shadow(0 0 14px rgba(240,180,41,.4)) drop-shadow(0 0 30px rgba(0,229,255,.2))}
  50%    {filter:drop-shadow(0 0 28px rgba(240,180,41,.7)) drop-shadow(0 0 55px rgba(0,229,255,.35))}
}
.brand-hex-inner{
  position:relative;z-index:1;font-size:36px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}

/* ATG wordmark */
.brand-atg{
  font-size:13px;font-weight:900;letter-spacing:4px;
  color:var(--gold);text-transform:uppercase;margin-bottom:4px;
  text-shadow:0 0 20px rgba(240,180,41,.5);
}
.brand-name{
  font-size:26px;font-weight:900;letter-spacing:.3px;
  background:var(--atg);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;line-height:1.1;
}
.brand-tag{font-size:12px;color:var(--mu2);margin-top:5px;letter-spacing:.5px}

/* Premium badge */
.brand-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,rgba(240,180,41,.14),rgba(0,229,255,.08));
  border:1px solid rgba(240,180,41,.28);
  border-radius:20px;padding:4px 14px;margin-top:10px;
  font-size:10px;font-weight:800;color:var(--gold);
  letter-spacing:1.2px;text-transform:uppercase;
  box-shadow:0 0 16px rgba(240,180,41,.12);
}
.brand-badge::before{content:'◆';font-size:7px;opacity:.7}

/* ══════════════════════════════════════
   GLASS CARD — ATG STYLE
══════════════════════════════════════ */
.card{
  width:100%;max-width:430px;
  background:var(--glass);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border:1px solid var(--b2);
  border-radius:var(--r);
  padding:30px 26px 28px;
  box-shadow:var(--sh),var(--shg),0 0 0 1px rgba(255,255,255,.04) inset;
  position:relative;overflow:hidden;
  animation:cardIn .6s .12s var(--spring) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Gold shimmer top line */
.card::before{
  content:'';position:absolute;top:0;left:6%;right:6%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),rgba(0,229,255,.7),transparent);
}
/* Inner glow */
.card::after{
  content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:radial-gradient(ellipse 65% 30% at 50% 0%,rgba(240,180,41,.045),transparent 55%);
}

/* Corner accents */
.card-corner{position:absolute;width:18px;height:18px}
.card-corner.tl{top:0;left:0;border-top:2px solid var(--gold);border-left:2px solid var(--gold);border-radius:var(--r) 0 0 0}
.card-corner.tr{top:0;right:0;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);border-radius:0 var(--r) 0 0}
.card-corner.bl{bottom:0;left:0;border-bottom:2px solid var(--cyan);border-left:2px solid var(--gold);border-radius:0 0 0 var(--r)}
.card-corner.br{bottom:0;right:0;border-bottom:2px solid var(--gold);border-right:2px solid var(--cyan);border-radius:0 0 var(--r) 0}

/* ══ TABS ══ */
.tabs{
  display:flex;
  background:rgba(0,0,0,.40);
  border:1px solid var(--b1);
  border-radius:var(--rm);
  padding:4px;gap:4px;
  margin-bottom:22px;position:relative;z-index:1;
}
.tab{
  flex:1;padding:11px 12px;border:none;background:none;
  color:var(--mu2);font-size:13.5px;font-weight:700;
  cursor:pointer;border-radius:12px;letter-spacing:.3px;
  transition:all .22s var(--ease);font-family:inherit;
}
.tab.on{
  background:var(--atg);color:#05080f;
  box-shadow:0 4px 22px rgba(240,180,41,.28),0 0 16px rgba(0,229,255,.15);
}

/* ══ FORM ══ */
.sec{display:none;position:relative;z-index:1}
.sec.on{display:block;animation:secIn .2s var(--ease)}
@keyframes secIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.fg{margin-bottom:15px}
.fl{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--mu2);
  margin-bottom:7px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;
}
.fi{
  width:100%;
  background:rgba(0,0,0,.45);
  border:1px solid var(--b1);
  color:var(--tx);padding:14px 16px;
  border-radius:12px;font-size:14px;font-weight:500;
  outline:none;transition:all .22s var(--ease);
  -webkit-appearance:none;font-family:inherit;
}
.fi::placeholder{color:rgba(90,110,142,.5)}
.fi:focus{
  border-color:var(--gold);
  background:rgba(0,0,0,.55);
  box-shadow:0 0 0 3px rgba(240,180,41,.12),0 0 20px rgba(240,180,41,.06);
}

.pw-w{position:relative}
.pw-w .fi{padding-right:48px}
.pw-eye{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--mu);cursor:pointer;
  font-size:17px;line-height:1;padding:3px;transition:color .15s;
}
.pw-eye:hover{color:var(--gold)}

/* ══ BUTTONS ══ */
.btn{
  width:100%;padding:15px;border:none;border-radius:13px;
  font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.5px;
  position:relative;overflow:hidden;
  transition:transform .14s,filter .14s,box-shadow .2s;
  -webkit-appearance:none;font-family:inherit;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-120%);transition:transform .44s ease;
}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{filter:brightness(1.10)}
.btn:active{transform:scale(.972)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

.btn-atg{
  background:var(--atg);color:#03060f;
  box-shadow:0 8px 28px rgba(240,180,41,.28),0 0 40px rgba(0,229,255,.10);
  text-shadow:0 1px 2px rgba(0,0,0,.2);
}
.btn-blue{
  background:var(--atg3);color:#fff;
  box-shadow:0 8px 28px rgba(79,141,255,.28);
}

/* ══ DIVIDER ══ */
.dv{
  display:flex;align-items:center;gap:11px;
  margin:20px 0 16px;color:var(--mu);font-size:11px;
  font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
}
.dv::before,.dv::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(240,180,41,.18),transparent);
}

/* ══ OAUTH BUTTONS ══ */
.ob{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--b1);
  border-radius:12px;color:var(--tx2);
  font-size:13.5px;font-weight:600;
  cursor:pointer;text-decoration:none;
  display:flex;align-items:center;justify-content:center;
  gap:10px;margin-bottom:9px;
  transition:all .22s var(--ease);font-family:inherit;
  position:relative;overflow:hidden;
}
.ob:hover{
  background:rgba(255,255,255,.065);
  border-color:rgba(240,180,41,.22);
  box-shadow:0 4px 20px rgba(0,0,0,.28),0 0 16px rgba(240,180,41,.06);
}
.ob:active{transform:scale(.975)}
.ob svg{width:19px;height:19px;flex-shrink:0}
.ob-badge{
  margin-left:auto;font-size:9.5px;font-weight:800;
  background:rgba(240,180,41,.12);color:var(--gold);
  border:1px solid rgba(240,180,41,.24);
  border-radius:20px;padding:2px 9px;letter-spacing:.3px;
}
.ob-chk{
  margin-left:auto;width:20px;height:20px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--cyan));
  color:#03060f;font-size:10px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}

/* ══ ALERT ══ */
.alert{
  background:rgba(248,81,73,.10);border:1px solid rgba(248,81,73,.24);
  border-radius:var(--rxs);padding:11px 14px;
  font-size:13px;color:#ff7b72;margin-bottom:16px;
  display:none;align-items:center;gap:8px;
}
.alert.on{display:flex;animation:alertIn .2s var(--ease)}
@keyframes alertIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ══ SPINNER ══ */
.sp{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(0,0,0,.18);border-top-color:rgba(0,0,0,.7);
  border-radius:50%;animation:spin .5s linear infinite;
  vertical-align:middle;margin-right:5px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ MODAL ══ */
.mo{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.85);z-index:900;
  align-items:flex-end;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mo.on{display:flex}
.mb{
  background:linear-gradient(180deg,#0c1630,#080d1e);
  border:1px solid var(--b2);
  border-radius:var(--r) var(--r) 0 0;
  padding:8px 24px 44px;
  width:100%;max-width:440px;max-height:92vh;overflow-y:auto;
  position:relative;
  animation:shUp .28s cubic-bezier(.34,1.36,.64,1);
  box-shadow:0 -16px 60px rgba(0,0,0,.65),0 0 0 1px rgba(240,180,41,.08) inset;
  -webkit-overflow-scrolling:touch;
}
.mb::before{
  content:'';display:block;width:44px;height:4px;
  background:var(--atg);border-radius:2px;
  margin:14px auto 22px;opacity:.5;
}
@keyframes shUp{from{transform:translateY(100%)}to{transform:none}}
@media(min-width:520px){
  .mo{align-items:center;padding:20px}
  .mb{border-radius:var(--r);padding:28px 26px 32px;animation:slUp .24s cubic-bezier(.34,1.1,.64,1)}
  .mb::before{display:none}
  @keyframes slUp{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
}
.mc{
  position:absolute;top:18px;right:18px;
  background:rgba(255,255,255,.06);border:1px solid var(--b1);
  color:var(--mu);width:30px;height:30px;border-radius:50%;
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.mc:hover{background:rgba(248,81,73,.14);color:var(--re)}
.mt{font-size:18px;font-weight:800;margin-bottom:6px;color:var(--tx)}
.ms{font-size:12.5px;color:var(--mu2);line-height:1.75;margin-bottom:20px}
.ms a{color:var(--cyan);text-decoration:none}
.ms a:hover{text-decoration:underline}
.ms code{
  background:rgba(240,180,41,.08);padding:2px 7px;
  border-radius:5px;font-size:11px;color:var(--gold);
  font-family:'SF Mono',Menlo,monospace;user-select:all;
}
.mr{margin-top:14px;padding:11px 14px;border-radius:var(--rxs);font-size:13px;display:none}
.mr.ok{background:rgba(240,180,41,.10);border:1px solid rgba(240,180,41,.22);color:var(--gold)}
.mr.err{background:rgba(248,81,73,.10);border:1px solid rgba(248,81,73,.22);color:var(--re)}

/* ══ FOOTER ══ */
.foot{
  margin-top:22px;text-align:center;
  font-size:11.5px;color:var(--mu);line-height:1.9;
  animation:cardIn .6s .28s var(--spring) both;
}
.foot span{
  background:var(--atg);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;font-weight:700;
}

/* ══ RESPONSIVE ══ */
@media(max-width:380px){
  .card{padding:22px 16px}
  .brand-hex{width:74px;height:74px}
  .brand-hex-inner{font-size:30px}
  .brand-name{font-size:22px}
}
@media(min-width:600px){
  .card{max-width:448px;padding:36px 34px 34px}
  .brand-hex{width:96px;height:96px}
  .brand-hex-inner{font-size:40px}
  .brand-name{font-size:28px}
  .wrap{padding:44px 24px 56px}
}
@media(min-width:1024px){
  .card{max-width:460px;padding:40px 38px 38px}
  .brand-hex{width:104px;height:104px}
  .brand-hex-inner{font-size:44px}
}
</style>
</head>
<body>

<!-- ══ BACKGROUND ══ -->
<div id="bg">
  <div class="bg-base"></div>
  <div class="orb og"></div>
  <div class="orb oc"></div>
  <div class="orb op"></div>
  <div class="bg-grid"></div>
  <div class="scanline"></div>
  <canvas id="ptc"></canvas>
</div>

<div class="wrap">

  <!-- ATG Brand -->
  <div class="brand">
    <div class="brand-hex">
      <div class="brand-hex-inner">⚡</div>
    </div>
    <div class="brand-atg">AsifTechGlobal</div>
    <div class="brand-name">YT Bot Panel</div>
    <div class="brand-tag">YouTube Live Chat Automation Platform</div>
    <div class="brand-badge">Ultra Premium v2.0</div>
  </div>

  <!-- Glass Card -->
  <div class="card">
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab on" id="t-si" onclick="sw('si')">Sign In</button>
      <button class="tab"    id="t-rg" onclick="sw('rg')">Register</button>
    </div>

    <!-- Alert -->
    <div class="alert" id="al"><span>⚠</span><span id="alTxt"></span></div>

    <!-- SIGN IN -->
    <div class="sec on" id="s-si">
      <div class="fg">
        <label class="fl">✉ Email Address</label>
        <input class="fi" id="si-e" type="email" placeholder="you@example.com"
          autocomplete="email" inputmode="email">
      </div>
      <div class="fg">
        <label class="fl">🔒 Password</label>
        <div class="pw-w">
          <input class="fi" id="si-p" type="password" placeholder="Enter your password"
            autocomplete="current-password">
          <button class="pw-eye" type="button" onclick="togPw('si-p',this)">👁</button>
        </div>
      </div>
      <button class="btn btn-atg" id="si-btn" onclick="doLogin()">Sign In to ATG Panel</button>

      <div class="dv">or continue with</div>

      <button class="ob" onclick="oGo('google')">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
        {% if google_on %}<span class="ob-chk">✓</span>{% else %}<span class="ob-badge">Setup</span>{% endif %}
      </button>

      <button class="ob" onclick="oGo('facebook')">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Continue with Facebook
        {% if facebook_on %}<span class="ob-chk">✓</span>{% else %}<span class="ob-badge">Setup</span>{% endif %}
      </button>
    </div>

    <!-- REGISTER -->
    <div class="sec" id="s-rg">
      <div class="fg">
        <label class="fl">👤 Full Name</label>
        <input class="fi" id="rg-n" type="text" placeholder="Your full name" autocomplete="name">
      </div>
      <div class="fg">
        <label class="fl">✉ Email Address</label>
        <input class="fi" id="rg-e" type="email" placeholder="you@example.com"
          autocomplete="email" inputmode="email">
      </div>
      <div class="fg">
        <label class="fl">🔑 Password
          <span style="font-weight:500;color:var(--mu);font-size:10px;margin-left:4px;text-transform:none">(min 6 chars)</span>
        </label>
        <div class="pw-w">
          <input class="fi" id="rg-p" type="password" placeholder="Create a strong password"
            autocomplete="new-password">
          <button class="pw-eye" type="button" onclick="togPw('rg-p',this)">👁</button>
        </div>
      </div>
      <button class="btn btn-blue" id="rg-btn" onclick="doReg()">Create ATG Account</button>

      <div class="dv">or sign up with</div>

      <button class="ob" onclick="oGo('google')">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign up with Google
        {% if not google_on %}<span class="ob-badge">Setup</span>{% endif %}
      </button>
      <button class="ob" onclick="oGo('facebook')">
        <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Sign up with Facebook
        {% if not facebook_on %}<span class="ob-badge">Setup</span>{% endif %}
      </button>
    </div>
  </div>

  <div class="foot">
    <span>AsifTechGlobal</span> &nbsp;·&nbsp; All sessions encrypted 🔐
  </div>
</div>

<!-- OAuth Setup Modal -->
<div class="mo" id="modal" onclick="bgC(event)">
  <div class="mb">
    <button class="mc" onclick="cModal()">✕</button>
    <div id="m-ico" style="font-size:32px;text-align:center;margin-bottom:10px"></div>
    <div class="mt" id="m-ttl"></div>
    <div class="ms" id="m-sub"></div>
    <div class="fg">
      <label class="fl" id="m-lid">Client ID</label>
      <input class="fi" id="m-cid" type="text" placeholder="Paste here…" autocomplete="off">
    </div>
    <div class="fg">
      <label class="fl" id="m-lsc">Client Secret</label>
      <input class="fi" id="m-csc" type="password" placeholder="Paste here…" autocomplete="off">
    </div>
    <button class="btn btn-atg" id="m-sv" onclick="saveOA()">💾 Save &amp; Apply</button>
    <div class="mr" id="m-res"></div>
  </div>
</div>

<script>
const GON={{ 'true' if google_on   else 'false' }};
const FON={{ 'true' if facebook_on else 'false' }};
let _pv=null;

/* URL error */
const _ue=new URLSearchParams(location.search).get('error');
if(_ue) showAl(
  _ue==='google_failed'           ?'Google login failed. Try again.':
  _ue==='facebook_failed'         ?'Facebook login failed. Try again.':
  _ue==='google_not_configured'   ?'Google not configured. Setup below.':
  _ue==='facebook_not_configured' ?'Facebook not configured. Setup below.':
  'Auth error. Try again.'
);

/* ══ ATG Particles — Gold & Cyan ══ */
(function(){
  const c=document.getElementById('ptc'),x=c.getContext('2d');
  let W,H,P;
  function rsz(){
    W=c.width=innerWidth;H=c.height=innerHeight;
    P=Array.from({length:Math.floor(W*H/14000)},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
      r:Math.random()*1.4+.3,
      a:Math.random()*.40+.08,
      c:Math.random()<.55?'240,180,41':'0,229,255'
    }));
  }
  function draw(){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);
      x.fillStyle=`rgba(${p.c},${p.a})`;x.fill();
    });
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){
      const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<110){
        x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);
        x.strokeStyle=`rgba(240,180,41,${(1-d/110)*.045})`;
        x.lineWidth=.5;x.stroke();
      }
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',rsz);rsz();draw();
})();

/* ══ Tab switch ══ */
function sw(t){
  ['si','rg'].forEach(v=>{
    document.getElementById('t-'+v).classList.toggle('on',v===t);
    document.getElementById('s-'+v).classList.toggle('on',v===t);
  });
  hideAl();
}

/* ══ Alert ══ */
function showAl(m){document.getElementById('alTxt').textContent=m;document.getElementById('al').classList.add('on')}
function hideAl(){document.getElementById('al').classList.remove('on')}

/* ══ Password ══ */
function togPw(id,btn){
  const el=document.getElementById(id),show=el.type==='text';
  el.type=show?'password':'text';btn.textContent=show?'👁':'🙈';
}

/* ══ Loading ══ */
function setL(id,on,lbl){
  const b=document.getElementById(id);b.disabled=on;
  b.innerHTML=on?`<span class="sp"></span>Please wait…`:lbl;
}

/* ══ Login ══ */
async function doLogin(){
  const e=document.getElementById('si-e').value.trim();
  const p=document.getElementById('si-p').value;
  if(!e||!p){showAl('Enter email and password');return}
  setL('si-btn',true,'Sign In to ATG Panel');hideAl();
  try{
    const d=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:e,password:p})}).then(r=>r.json());
    if(d.ok)location.href='/';
    else{showAl(d.msg);setL('si-btn',false,'Sign In to ATG Panel')}
  }catch{showAl('Connection error');setL('si-btn',false,'Sign In to ATG Panel')}
}

/* ══ Register ══ */
async function doReg(){
  const n=document.getElementById('rg-n').value.trim();
  const e=document.getElementById('rg-e').value.trim();
  const p=document.getElementById('rg-p').value;
  if(!n||!e||!p){showAl('All fields required');return}
  if(p.length<6){showAl('Password min 6 characters');return}
  setL('rg-btn',true,'Create ATG Account');hideAl();
  try{
    const d=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:n,email:e,password:p})}).then(r=>r.json());
    if(d.ok)location.href='/';
    else{showAl(d.msg);setL('rg-btn',false,'Create ATG Account')}
  }catch{showAl('Connection error');setL('rg-btn',false,'Create ATG Account')}
}

/* ══ OAuth ══ */
const PROV={
  google:{ico:'🔵',ttl:'Setup Google Login',
    sub:`Get from <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console →</a><br>
         APIs &amp; Services → Credentials → OAuth 2.0 Client ID<br>
         Add Redirect URI:<br>
         <code>http://localhost:5000/auth/google/callback</code><br>
         <code>http://YOUR_IP:5000/auth/google/callback</code>`,
    idL:'Client ID',scL:'Client Secret',idK:'GOOGLE_CLIENT_ID',scK:'GOOGLE_CLIENT_SECRET'},
  facebook:{ico:'🔵',ttl:'Setup Facebook Login',
    sub:`Get from <a href="https://developers.facebook.com/apps/" target="_blank">Facebook Developers →</a><br>
         Add Facebook Login → Set Redirect URI:<br>
         <code>http://YOUR_IP:5000/auth/facebook/callback</code>`,
    idL:'App ID',scL:'App Secret',idK:'FACEBOOK_APP_ID',scK:'FACEBOOK_APP_SECRET'},
};
function oGo(p){(p==='google'?GON:FON)?location.href='/auth/'+p:oModal(p)}
function oModal(p){
  _pv=p;const i=PROV[p];
  document.getElementById('m-ico').textContent=i.ico;
  document.getElementById('m-ttl').textContent=i.ttl;
  document.getElementById('m-sub').innerHTML=i.sub;
  document.getElementById('m-lid').textContent=i.idL;
  document.getElementById('m-lsc').textContent=i.scL;
  document.getElementById('m-cid').value='';
  document.getElementById('m-csc').value='';
  const r=document.getElementById('m-res');r.className='mr';r.style.display='none';
  document.getElementById('m-sv').disabled=false;
  document.getElementById('m-sv').innerHTML='💾 Save &amp; Apply';
  document.getElementById('modal').classList.add('on');
}
function cModal(){document.getElementById('modal').classList.remove('on')}
function bgC(e){if(e.target===e.currentTarget)cModal()}
async function saveOA(){
  const i=PROV[_pv];
  const cid=document.getElementById('m-cid').value.trim();
  const sec=document.getElementById('m-csc').value.trim();
  if(!cid||!sec){showMR('Enter both credentials',false);return}
  const btn=document.getElementById('m-sv');
  btn.disabled=true;btn.innerHTML='<span class="sp"></span>Saving…';
  try{
    const b={};b[i.idK]=cid;b[i.scK]=sec;
    const d=await fetch('/api/oauth-save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(b)}).then(r=>r.json());
    if(d.ok){showMR('✅ Saved! Redirecting…',true);setTimeout(()=>location.href='/auth/'+_pv,1300)}
    else{showMR('❌ '+(d.msg||'Save failed'),false);btn.disabled=false;btn.innerHTML='💾 Save &amp; Apply'}
  }catch{showMR('Connection error',false);btn.disabled=false;btn.innerHTML='💾 Save &amp; Apply'}
}
function showMR(m,ok){const el=document.getElementById('m-res');el.textContent=m;el.className='mr '+(ok?'ok':'err');el.style.display='block'}

/* Enter key */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  document.getElementById('s-si').classList.contains('on')?doLogin():doReg();
});
</script>
</body>
</html>
